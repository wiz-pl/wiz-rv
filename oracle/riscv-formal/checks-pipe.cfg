# riscv-formal configuration for the Wiz pipelined core (Rv.Pipe).
#
# The core is the flat Verilog emitted by oracle/wiz/emit_pipe.wiz (module
# `oracle_rvfi`), whose outputs are the rvfi retirement port (Pp.rvfi in
# src/Rv/Pipe.wiz), wrapped by `rvfi` (generated by mkrvfi_pipe.py) and
# `rvfi_wrapper` (wrapper.sv).  run-rvfi.sh --pipe copies this file into
# riscv-formal/cores/wiz-rv/ and rewrites `insn` to the check cycle.
#
# No CSRs, no compressed instructions, no M extension: the Wiz pipeline here is
# RV32I.  `RISCV_FORMAL_ALIGNED_MEM` matches the port, which reports a 4-byte-aligned
# address and shifted byte masks.
#
# The check cycle is the pipeline's retirement cycle: an instruction fetched at cycle
# 1 is in E at 2, M at 3 and R (retiring, `rv_v && !rv_miss`) at 4.  Every base-I
# class — ALU, branch/jump and load — has its first beat at 4 (a taken branch
# redirects in E, so the beats are three cycles apart but the first is still 4; the
# multi-cycle core needed 3 for ALU and 4 for loads).
#
# Only the `insn` checks are configured for the pipeline.  The consistency checks
# (reg, pc_fwd, pc_bwd, causal, unique, liveness, causal_mem) need their own cycle
# plan on a repeated-instruction program and are NOT run here; `run-rvfi.sh --pipe`
# only ever runs insn_* checks.  (The multi-cycle plan for them is checks.cfg and
# checks-consistency.cfg.)

[options]
isa rv32i

[depth]
insn      4

[verilog-files]
@basedir@/cores/@core@/core.v
@basedir@/cores/@core@/rvfi.v
@basedir@/cores/@core@/wrapper.sv

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
