# riscv-formal configuration for the Wiz multi-cycle RV32IM core: the M-extension
# checks (`insn_mul_ch0`, `insn_mulh_ch0`, `insn_mulhsu_ch0`, `insn_mulhu_ch0`,
# `insn_div_ch0`, `insn_divu_ch0`, `insn_rem_ch0`, `insn_remu_ch0`).
#
# run-rvfi.sh --instruction <m-op> selects this file automatically (the fixture's
# `rv32im` cfg also makes emit_core build the multiplier/divider).  There is no
# check literally named `rvfi_muldiv` at the pinned riscv-formal revision: the
# eight checks come from the Sail-derived instruction models in
# `insns/isa_rv32im.txt`, exactly as the base-I checks do.  The base-I
# configuration (checks.cfg) stays `isa rv32i`, so the 37 base-I checks run
# against the core without the multiplier.
#
# The core has no CSRs and no compressed instructions.  `RISCV_FORMAL_ALIGNED_MEM`
# matches the wrapper, which reports a 4-byte-aligned address and shifted byte
# masks; the core traps on misaligned accesses.

[options]
isa rv32im

[depth]
insn      20
reg       15 25
pc_fwd    10 30
pc_bwd    10 30
causal    10 30
causal_mem 10 30
unique    1 10 30
liveness  1 10 30

[verilog-files]
@basedir@/cores/@core@/core.v
@basedir@/cores/@core@/rvfi.v
@basedir@/cores/@core@/wrapper.sv

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
