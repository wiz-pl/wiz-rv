# Consistency-check configuration for the formal harness, aligned with the
# retirement pattern of a load: the core retires at cycles 4, 7, 10, … (3-cycle
# load), so every trigger/check cycle below is such a cycle.  Used with
# `--instruction lw --cfg oracle/riscv-formal/checks-consistency.cfg`.
#
# The per-instruction configuration (checks.cfg) is for `insn_*` checks; this one
# is for reg/pc/causal/unique/liveness, which look at consecutive retirements.
[options]
isa rv32i

[depth]
insn      4
reg       15 25
pc_fwd    10 31
pc_bwd    10 31
causal    10 31
causal_mem 10 31
unique    1 10 31
liveness  1 10 31

[verilog-files]
@basedir@/cores/@core@/core.v
@basedir@/cores/@core@/rvfi.v
@basedir@/cores/@core@/wrapper.sv

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
