# riscv-formal configuration for the Wiz multi-cycle RV32I core.
#
# The core is the flat Verilog emitted by oracle/wiz/emit_core.wiz (module
# `oracle_core`), wrapped by `rvfi` (generated by mkrvfi.py) and `rvfi_wrapper`
# (wrapper.sv).  This file is copied into riscv-formal/cores/wiz-rv/ by
# run-rvfi.sh and genchecks.py turns it into checks/*.sby.
#
# No CSRs, no compressed instructions, no M extension: the Wiz core here is
# RV32I.  `RISCV_FORMAL_ALIGNED_MEM` matches the wrapper, which reports a
# 4-byte-aligned address and shifted byte masks; the core traps on misaligned
# accesses.

[options]
isa rv32i

[depth]
insn      20
reg       15 25
pc_fwd    10 30
pc_bwd    10 30
causal    10 30
causal_mem 10 30
unique    1 10 30
liveness  1 10 30

[verilog-files]
@basedir@/cores/@core@/core.v
@basedir@/cores/@core@/rvfi.v
@basedir@/cores/@core@/wrapper.sv

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
